name: CI Laravel

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, mbstring, bcmath, zip

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist

      - name: Vérifier le formatage avec Pint
        run: ./vendor/bin/pint --test

  analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, mbstring, bcmath, zip

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist

      - name: Analyse statique PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  tests:
    runs-on: ubuntu-latest
    needs: [ lint, analyse ]
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, mbstring, bcmath, zip
          coverage: xdebug

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist

      - name: Préparer le .env de test

        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing

      - name: Tests avec couverture HTML
        run: php artisan test --coverage-html reports/coverage

      - name: Publier le rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: reports/coverage
      - name: Audit des dependances
        continue-on-error: true # continue si ya pas de wifi (merge dans le main)
        run: composer audit --abandoned=ignore --ignore-severity=low,moderate # pour ignorer lerreur
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [ tests ]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Installer Laravel Cloud CLI
        run: composer global require laravel/cloud-cli

      - name: Déployer sur Laravel Cloud
        env:
          LARAVEL_CLOUD_TOKEN: ${{ secrets.LARAVEL_CLOUD_TOKEN }}
        run: |
          export PATH="$(composer global config bin-dir --absolute):$PATH"
          cloud auth:token --add "$LARAVEL_CLOUD_TOKEN"
          cloud deploy --environment="staging"



