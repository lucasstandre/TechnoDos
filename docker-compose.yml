services:
  app:                          # nom du service (choix libre)
    build:          # utiliser le dockerfile
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/var/www/html         # code source montÃ©
    networks:
      - laravel

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"               # port hÃ´te:port conteneur
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app                     # dÃ©marre aprÃ¨s app
    networks:
      - laravel

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql   # volume nommÃ© pour persister les donnÃ©es
    networks:
      - laravel

volumes:
  mysql_data:                   # volume nommÃ© dÃ©clarÃ© ici

networks:
  laravel:                      # rÃ©seau interne entre les services
